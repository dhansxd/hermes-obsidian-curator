name: obsidian-curator
version: 0.6.4
manifest_version: 1

description: "One full native Hermes background agent whose only task is managing Obsidian."
author: Dani & Dyra
provides_tools:
  - obsidian_curator
provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - post_llm_call
  - post_tool_call
  - on_session_finalize
  - on_session_reset
  - subagent_start
  - subagent_stop
config_schema:
  vault_path:
    type: str
    description: "Absolute path to the Obsidian vault."
  review_interval:
    type: int
    description: "Number of eligible events between background reviews."
  curator_prompt:
    type: str
    description: "User- and agent-defined instructions for managing this specific vault."
  trigger_on_turns:
    type: bool
    default: true
    description: "Whether completed conversation turns count towards review_interval."
  trigger_on_tools:
    type: bool
    default: true
    description: "Whether completed tool calls count towards review_interval."
  allowed_toolsets:
    type: list
    default:
      - file
      - skills
    description: "Fixed curator toolsets; only file and skills are accepted."
  blocked_tools:
    type: list
    default: []
    description: "List of individual tool names blocked for the curator subagent."
  skills:
    type: list
    default: []
    description: "List of skills to preload before each curation pass."
  model_override:
    type: str
    description: "Custom model override for the background curator subagent (default null = inherit parent session model)."

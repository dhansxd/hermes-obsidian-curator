name: obsidian-curator
version: 0.1.3
manifest_version: 1
description: "One full native Hermes background agent whose only task is managing Obsidian."
author: Dani & Dyra
provides_tools:
  - obsidian_curator
provides_hooks:
  - pre_llm_call
  - post_llm_call
  - subagent_start
  - subagent_stop
config_schema:
  vault_path:
    type: str
    description: "Absolute path to the Obsidian vault."
  review_interval:
    type: int
    description: "Number of eligible Hermes activity turns between background reviews."

name: obsidian-curator
version: 0.8.2
manifest_version: 1

description: "Turn-triggered Obsidian curation using Hermes' native cron runner."
author: Dani & Dyra
provides_tools:
  - obsidian_curator
provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - post_llm_call
  - post_tool_call
  - on_session_finalize
  - on_session_reset
config_schema:
  vault_path:
    type: str
    description: "Absolute path to the Obsidian vault."
  review_interval:
    type: int
    description: "Number of eligible events between background reviews."
  curator_prompt:
    type: str
    description: "User- and agent-defined instructions for managing this specific vault."
  trigger_on_turns:
    type: bool
    default: true
    description: "Whether completed conversation turns count towards review_interval."
  trigger_on_tools:
    type: bool
    default: true
    description: "Whether completed tool calls count towards review_interval."
  enabled_toolsets:
    type: list
    default:
      - file
      - skills
    description: "Safe toolsets passed to the native cron runner; only file and skills are accepted."
  blocked_tools:
    type: list
    default: []
    description: "List of individual tool names blocked for the curator."
  skills:
    type: list
    default: []
    description: "List of skills preloaded by the native cron runner."
  model_override:
    type: str
    description: "Model override passed directly to the native cron runner."
  provider:
    type: str
    description: "Provider override passed directly to the native cron runner."
  base_url:
    type: str
    description: "Base URL override passed directly to the native cron runner."
  reasoning_effort:
    type: str
    description: "Reasoning effort passed directly to the native cron runner."
  workdir:
    type: str
    description: "Working directory passed directly to the native cron runner."
